<script>
const data = JSON.parse(document.getElementById("data").textContent);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const search = document.getElementById("search");
let page = 0, filtered = data.rows, size = 12;
function figure(label, src, extra, href, slug) {
  const img = src ? `<img loading="lazy" alt="${esc(label)}" src="${esc(src)}">` : `<div class="empty">No photo</div>`;
  const link = href ? `<div><a href="${esc(href)}" target="_blank" rel="noopener">Open listing</a></div>` : "";
  return `<div class="figure ${extra||""}"><label>${esc(label)}</label>${img}${slug?`<div class="slug">${esc(slug)}</div>`:""}${link}</div>`;
}
function render() {
  const q = search.value.trim().toLowerCase();
  filtered = data.rows.filter(row => !q || [row.name, row.set_name, row.number, row.id, ...row.versions.map(v => v.slug)].join(" ").toLowerCase().includes(q));
  const pages = Math.ceil(filtered.length / size) || 1;
  page = Math.max(0, Math.min(page, pages - 1));
  document.getElementById("position").textContent = `${filtered.length} cards · page ${page + 1} of ${pages}`;
  document.getElementById("prev").disabled = page === 0;
  document.getElementById("next").disabled = page + 1 >= pages;
  document.getElementById("list").innerHTML = filtered.slice(page * size, page * size + size).map(row => {
    const official = figure("Official", row.official);
    const versions = row.versions.map(v => figure(v.primary ? v.label + " · scan opens this" : v.label, v.file, v.primary ? "primary" : "", v.url, v.slug)).join("");
    return `<article class="card"><div class="cardtop"><h2>${esc(row.name)}</h2><div class="meta">${esc(row.set_name)} · ${esc(row.number)} · ${esc(row.id)}</div></div><div class="pictures">${official}${versions}</div></article>`;
  }).join("") || `<div class="empty">No cards match.</div>`;
}
search.oninput = () => { page = 0; render(); };
document.getElementById("prev").onclick = () => { page--; render(); window.scrollTo(0, 0); };
document.getElementById("next").onclick = () => { page++; render(); window.scrollTo(0, 0); };
render();
</script>
